name: Verify app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Reproducible archive
        run: |
          cp dist/*.tar.gz /tmp/first.tar.gz
          npm run build
          cmp /tmp/first.tar.gz dist/*.tar.gz
      - run: npm run smoke
      - run: npm run smoke
        env:
          NEXTCLOUD_SMOKE_DB: pgsql
      - run: npm run smoke
        env:
          NEXTCLOUD_SMOKE_DB: mysql
      - uses: actions/upload-artifact@v4
        with:
          name: integration-autophish
          path: dist/
